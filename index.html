html,body{margin:0;background:#fdfdfb;overflow:hidden}

/* Layout follows the Figma frame "portfolio" (1280 x 832), positions 1:1.
   The intro, in order:
   1. "Hi, I am Somya" is written stroke by stroke in the middle of the empty page (0.3s to 3.3s)
   2. it is pushed up into place (3.6s)
   3. the tagline writes out one line at a time (4.6s to 7s)
   4. "click to follow my journey" rises in (7.2s)
   5. from 3.6s, 300ms apart, the doodles sketch themselves in like pencil: the top flower,
      the bottom right flower, the bottom heart, then the rest
   Hovering the call to action grows four leaves along its underline.
   The two buttons in the corner fade in as before. */
@keyframes write-in{from{clip-path:inset(-25% 100% -25% -5%)}to{clip-path:inset(-25% -5% -25% -5%)}}
@keyframes lift{from{transform:translateY(34px)}to{transform:none}}
@keyframes appear{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* the name is written stroke by stroke: each letter's outline is drawn, then inked in */
.write-svg path{fill:#1a1a1a;fill-opacity:0;stroke:#1a1a1a;stroke-width:1.1;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--wd) ease-in-out var(--ws) both,ink .4s ease var(--wf) both}
@keyframes ink{to{fill-opacity:1}}
.lift{animation:lift .9s cubic-bezier(.2,.7,.2,1) 3.6s both}
.line-1{animation:write-in 1.2s linear 4.6s both}
.line-2{animation:write-in 1.2s linear 5.8s both}
/* the tagline reads as one line on wider screens and splits in two on phones */
@media (min-width: 701px){.tagline{flex-direction:row !important;gap:.28em}}
.rise-cta{animation:rise .8s ease 7.2s both}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s ease-in-out var(--d) both}
.dot{animation:appear .3s ease calc(var(--d) + 1.2s) both}
@keyframes draw{to{stroke-dashoffset:0}}
.cta-leaf path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .5s ease}
.cta-leaf:nth-child(2) path{transition-delay:.12s}
.cta-leaf:nth-child(3) path{transition-delay:.24s}
.cta-leaf:nth-child(4) path{transition-delay:.36s}
.rise-cta:hover .cta-leaf path,.rise-cta:focus-visible .cta-leaf path,.play-cta:hover .cta-leaf path,.play-cta:focus-visible .cta-leaf path{stroke-dashoffset:0}
.rise-controls{animation:appear .8s ease 7.2s both}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}50%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}}
@media (prefers-reduced-motion: reduce){.write-svg path{animation:none;stroke-dashoffset:0;fill-opacity:1}.write-name,.lift,.line-1,.line-2,.rise-cta,.draw,.dot,.rise-controls,.site-mark:hover .mark-face{animation:none}.draw{stroke-dashoffset:0}.cta-leaf path{transition:none}}
/* Story pages: when a page comes into view its words fade in one after another
   (label, then headline, then the line below, then the pictures). */
.fade{opacity:0}
.p1-in .fade-1,.p2-in .fade-2,.p3-in .fade-3,.p4-in .fade-4{animation:fade-in .8s ease var(--fd) both}
@keyframes fade-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* Vine leaves: each one slowly grows out, stays a while, then drops off and grows back. */
/* The vines grow once the reader lands on the work pages: the stem is revealed from the
   ground up at a steady rate, each leaf opens as the stem reaches it, and once the vine is
   whole the leaves take turns (bottom first) falling to the ground with a little sway,
   fading out there, and growing back on the vine. */
.vine-reveal{transform:translateY(940px)}
.p1-in .vine-reveal{animation:vine-reveal 7.5s linear .5s both}
.p1-in .vine-reveal-r{animation-delay:4.25s}
@keyframes vine-reveal{from{transform:translateY(940px)}to{transform:translateY(-60px)}}
/* each leaf opens as the stem reaches it (outer group), then loops on its own clock (inner group):
   it hangs on for a long while, lets go, drifts down with a little sway and is gone within a
   second, rests, then slowly grows back */
.vine-leaf,.vine-drop{transform-box:view-box;transform-origin:var(--ox) var(--oy)}
.vine-leaf{opacity:0}.vine-leaf path{stroke-dasharray:1 1;stroke-dashoffset:1;fill-opacity:0}
.p1-in .vine-leaf{animation:leaf-open 1.4s cubic-bezier(.25,.6,.3,1) var(--pd) both}.p1-in .vine-leaf path{animation:leaf-draw 1.3s ease-in-out calc(var(--pd) + var(--dl, 0s)) both}
.p1-in .vine-drop{animation:leaf-drop var(--dur) linear var(--cd) infinite}
@keyframes leaf-open{from{opacity:0;transform:scale(.55)}12%{opacity:1}to{opacity:1;transform:scale(1)}}@keyframes leaf-draw{0%{stroke-dashoffset:1;fill-opacity:0}55%{stroke-dashoffset:0;fill-opacity:0}100%{stroke-dashoffset:0;fill-opacity:1}}
@keyframes leaf-drop{
  0%,60%{opacity:1;transform:none}
  61%{opacity:1;transform:translate(0,3px) rotate(8deg);animation-timing-function:ease-in-out}
  65%{opacity:.85;transform:translate(var(--sw),28px) rotate(-14deg);animation-timing-function:ease-in-out}
  69%{opacity:.6;transform:translate(calc(var(--sw) * -1),60px) rotate(12deg);animation-timing-function:ease-in-out}
  73%{opacity:.25;transform:translate(var(--sw),92px) rotate(-10deg);animation-timing-function:ease-in-out}
  76%{opacity:0;transform:translate(calc(var(--sw) * -.5),116px) rotate(6deg)}
  76.1%,82%{opacity:0;transform:scale(0);animation-timing-function:cubic-bezier(.25,.6,.3,1)}
  92%,100%{opacity:1;transform:none}}
.story-page:not(.live) .vine-reveal,.story-page:not(.live) .vine-leaf,.story-page:not(.live) .vine-drop,.story-page:not(.live) .vine-leaf path{animation-play-state:paused}

@keyframes ch-hop{0%,100%{transform:none}35%{transform:translateY(-10px) rotate(-8deg)}65%{transform:translateY(2px) scaleY(.9)}}

.asset-tile:hover .play-badge,.asset-tile:focus-visible .play-badge{animation:badge-wiggle .5s ease}
@keyframes badge-nudge{0%,80%,100%{transform:rotate(4deg)}86%{transform:rotate(-3deg) scale(1.06)}92%{transform:rotate(6deg) scale(1.06)}}
@keyframes badge-wiggle{0%,100%{transform:rotate(4deg)}30%{transform:rotate(-5deg) scale(1.1)}60%{transform:rotate(8deg) scale(1.1)}}
.play-page:not(.live) .play-badge{animation-play-state:paused}
/* the viewer */
.asset-view{visibility:hidden;opacity:0;transition:opacity .35s ease,visibility 0s linear .35s}
.asset-view.open{visibility:visible;opacity:1;transition:opacity .35s ease}
.asset-card{transform:translateY(24px) scale(.97);transition:transform .45s cubic-bezier(.2,.7,.2,1)}

@keyframes idle-spin{to{transform:rotateY(360deg)}}
.play-in .play-fade{animation:fade-in .8s ease var(--fd) both}
/* each piece floats up into place, then bobs gently */
.play-in .play-tile{animation:float-in 1s cubic-bezier(.2,.7,.2,1) var(--fd) both,bob 6s ease-in-out calc(var(--fd) + 1s) infinite}
@keyframes float-in{from{opacity:0;transform:translateY(60px) rotate(0deg)}to{opacity:1;transform:rotate(var(--r))}}
@keyframes bob{0%,100%{transform:rotate(var(--r))}50%{transform:translateY(-8px) rotate(var(--r))}}

.track{transition:transform 1s cubic-bezier(.65,0,.35,1)}
.page-turn{transition:transform 1.2s cubic-bezier(.45,.05,.3,1),visibility 0s linear 0s}

/* Chapter three: the case study cards invite a click; picking one fades the page
   away piece by piece, then the chosen card flies up and becomes the header image. */
.case-card{transform:rotate(var(--r));transition:transform .3s ease,box-shadow .3s ease;cursor:pointer}
.case-card:hover,.case-card:focus-visible{transform:rotate(0deg) translateY(-6px) scale(1.02);box-shadow:0 14px 28px rgba(40,40,50,.18);outline:none}

.pic-card:hover,.pic-card:focus-within{transform:rotate(0deg) translateY(calc(var(--y,0px) - 6px)) scale(1.02);box-shadow:0 14px 28px rgba(40,40,50,.18)}

/* The letter garden: postcards lying under the trees, a little tilted. */
/* Contact journal: an open notebook drawn at 1280 x 832 (images/contact-journal.webp, exported from Figma),
   with the words laid on top as live text. The art is cut into two pages; each page shows its slice of the
   image (--ox/--oy is the slice's top-left corner), and every text block sits at its design x via --x.

        <div class="case-body" style="display: flex; flex-direction: column; max-width: 880px; margin: 0 auto; padding: 48px 40px 96px">
        <div class="case-q" style="display: {{quest1Display}}; flex-direction: column; gap: 40px">
          <header style="display: flex; flex-direction: column; gap: 12px">
            <span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #5d5d66">side quest 01</span>
            <h2 class="quest-title" ref="{{title1Ref}}" style="--tx: {{tx}}; --ty: {{ty}}; --ts: {{ts}}; margin: 0; font-family: 'Emilys Candy', 'Comic Sans MS', cursive; font-weight: 400; font-size: 52px; line-height: 1.1; color: #1a1a1a">Project Blueprint</h2>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c; font-size: 21px; line-height: 1.45; color: #2a2a2e">Establishing order in a product built at speed.</p>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">When our generative AI image tool grew faster than its foundations, I led the effort to replace one-off components with a shared design system, reducing design handoff questions by an estimated 65%.</p>
            <div style="display: flex; flex-wrap: wrap; gap: 12px 32px"><div style="display: flex; flex-direction: column; gap: 2px; min-width: 150px"><span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #9a9aa2">role</span><span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 16px; color: #2a2a2e">Product Designer</span></div><div style="display: flex; flex-direction: column; gap: 2px; min-width: 150px"><span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #9a9aa2">team</span><span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 16px; color: #2a2a2e">Three-person core design team, in partnership with Frontend Engineering</span></div><div style="display: flex; flex-direction: column; gap: 2px; min-width: 150px"><span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #9a9aa2">timeline</span><span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 16px; color: #2a2a2e">Six months, from April 2023</span></div><div style="display: flex; flex-direction: column; gap: 2px; min-width: 150px"><span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #9a9aa2">tools</span><span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 16px; color: #2a2a2e">Figma, Slack, shadcn/ui and ChatGPT (as references), Google (research)</span></div></div>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 14px; font-style: italic; line-height: 1.6; color: #7a7a82">To comply with my non-disclosure agreement, company and product names have been anonymised. All findings and opinions are my own and do not necessarily reflect the views of my former employer.</p>
          </header>
          <section style="display: flex; flex-direction: column; gap: 14px; padding-top: 28px; border-top: 1.5px dashed #deded6">
            <h3 style="margin: 0; font-family: 'Emilys Candy', 'Comic Sans MS', cursive; font-weight: 400; font-size: 34px; line-height: 1.15; color: #1a1a1a"><span style="font-size: 18px; color: #9a9aa2; margin-right: 10px">01</span>The context</h3>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">In late 2022, I joined an AI startup as a Product Designer. In January 2023, the company decided to build its own generative image tool from a blank canvas, entering a market in which DALL·E was the principal competitor. The timeline was short and the stakes were high.</p>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">I was one of three designers responsible for bringing the product to life. Together, we:</p>
            <ul style="margin: 0; padding-left: 24px; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c"><li style="margin-bottom: 6px">Defined the initial information architecture.</li><li style="margin-bottom: 6px">Conducted competitive analyses to establish interaction standards.</li><li style="margin-bottom: 6px">Divided features to meet deadlines, and worked jointly on the most critical screens.</li></ul>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">In addition, I owned major sections of the public-facing landing page, ensuring the first impression of the product matched the quality of the product itself.</p>
          </section>
          <section style="display: flex; flex-direction: column; gap: 14px; padding-top: 28px; border-top: 1.5px dashed #deded6">
            <h3 style="margin: 0; font-family: 'Emilys Candy', 'Comic Sans MS', cursive; font-weight: 400; font-size: 34px; line-height: 1.15; color: #1a1a1a"><span style="font-size: 18px; color: #9a9aa2; margin-right: 10px">02</span>The problem</h3>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">Our pace allowed us to launch quickly, but it came at a cost. Without a shared foundation, requirements changed faster than our design files, and design and engineering work became increasingly reactive. Three issues emerged:</p>
            <ul style="margin: 0; padding-left: 24px; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c"><li style="margin-bottom: 6px"><strong style="font-weight: 500; color: #1a1a1a">Inefficient workflows:</strong> designers and engineers repeatedly recreated existing elements.</li><li style="margin-bottom: 6px"><strong style="font-weight: 500; color: #1a1a1a">Inconsistent experience:</strong> the same component appeared in different forms across the product. At its peak, the product contained more than 11 variants of a single tab component, before counting one-off custom properties.</li><li style="margin-bottom: 6px"><strong style="font-weight: 500; color: #1a1a1a">Accumulating debt:</strong> each sprint added design and technical debt that later work had to absorb.</li></ul>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">The issue became clear when a developer contacted our team late one evening to ask which version of a button to use. There was no single source of truth, and our speed had begun to compromise the quality of the product.</p>
            <blockquote style="margin: 4px 0; padding: 4px 0 4px 20px; border-left: 2px solid #2a2a2e; font-family: 'Patrick Hand', cursive; font-size: 24px; line-height: 1.4; color: #2a2a2e">“We were attempting to achieve consistency by referencing past designs, but were inadvertently creating more design debt with every sprint.”</blockquote>

          <section style="display: flex; flex-direction: column; gap: 14px; padding-top: 28px; border-top: 1.5px dashed #deded6">
            <h3 style="margin: 0; font-family: 'Emilys Candy', 'Comic Sans MS', cursive; font-weight: 400; font-size: 34px; line-height: 1.15; color: #1a1a1a"><span style="font-size: 18px; color: #9a9aa2; margin-right: 10px">03</span>Evaluating the options</h3>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">We weighed two ways to start:</p>
            <ol style="margin: 0; padding-left: 24px; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c"><li style="margin-bottom: 6px"><strong style="font-weight: 500; color: #1a1a1a">Make the existing components consistent.</strong> Audit what had already shipped and bring each variant into line. This was quick to begin, but it would have locked in whatever visual decisions had been made under pressure, without asking whether they were the right ones.</li><li style="margin-bottom: 6px"><strong style="font-weight: 500; color: #1a1a1a">Define the design language first.</strong> Agree on the visual principles the product should follow, down to questions as basic as whether buttons and tabs should be fully circular or gently rounded, and then build components from those decisions.</li></ol>

            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">I chose to define the design language first. Consistency without a clear direction would only have standardised the inconsistencies; a shared language gave every later component, and every conversation with engineering, a reference point.</p>

          <section style="display: flex; flex-direction: column; gap: 14px; padding-top: 28px; border-top: 1.5px dashed #deded6">
            <h3 style="margin: 0; font-family: 'Emilys Candy', 'Comic Sans MS', cursive; font-weight: 400; font-size: 34px; line-height: 1.15; color: #1a1a1a"><span style="font-size: 18px; color: #9a9aa2; margin-right: 10px">04</span>My approach</h3>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 21px; line-height: 1.45; color: #2a2a2e">I proved the system in my own files first, then turned it into a standard that design and engineering shared.</p>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 14px"><div style="padding: 16px 18px; background: #ffffff; border: 1.5px solid #2a2a2e; border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #9a9aa2">step 1</span><span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 17px; font-weight: 500; line-height: 1.35; color: #1a1a1a">Set a universal scale</span><span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5; color: #5d5d66">Shared size tokens for padding, gaps, icons and radius, plus a 12-column grid, used in my own files before I proposed them.</span></div><div style="padding: 16px 18px; background: #ffffff; border: 1.5px solid #2a2a2e; border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #9a9aa2">step 2</span><span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 17px; font-weight: 500; line-height: 1.35; color: #1a1a1a">Start with one component</span><span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5; color: #5d5d66">Rebuilding the button showed how far the build had drifted from the designs.</span></div><div style="padding: 16px 18px; background: #ffffff; border: 1.5px solid #2a2a2e; border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #9a9aa2">step 3</span><span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 17px; font-weight: 500; line-height: 1.35; color: #1a1a1a">Bring in engineering</span><span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5; color: #5d5d66">I proposed a library owned jointly with the Head of Frontend.</span></div><div style="padding: 16px 18px; background: #ffffff; border: 1.5px solid #2a2a2e; border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #9a9aa2">step 4</span><span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 17px; font-weight: 500; line-height: 1.35; color: #1a1a1a">Win the go-ahead</span><span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5; color: #5d5d66">My manager backed a cross-functional meeting, which made the system an agreed project.</span></div></div>

            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">Following this initial success, the work evolved into a formal design system. With guidance from my manager, I studied established systems such as Atlassian's to inform our structure and governance.</p>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">Engineering became an active contributor rather than a recipient, proposing improvements and co-creating new components. The system rested on three principles:</p>
            <ul style="margin: 0; padding-left: 24px; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c"><li style="margin-bottom: 6px"><strong style="font-weight: 500; color: #1a1a1a">A shared component library,</strong> covering foundations through to avatars, modals and complex patterns.</li><li style="margin-bottom: 6px"><strong style="font-weight: 500; color: #1a1a1a">Shared ownership</strong> between design and engineering.</li><li style="margin-bottom: 6px"><strong style="font-weight: 500; color: #1a1a1a">A regular review cadence</strong> to update and maintain the system as the product evolved.</li></ul>

ect x="916" y="572" width="238" height="34" rx="8" style="fill: #ffffff"></rect><text x="930" y="594" style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 14; font-weight: 400; fill: #161a2b; text-anchor: start">Pagination</text><rect x="916" y="614" width="238" height="34" rx="8" style="fill: #ffffff"></rect><text x="930" y="636" style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 14; font-weight: 400; fill: #161a2b; text-anchor: start">View toggles (grid, list)</text></svg></div></div>

          <section style="display: flex; flex-direction: column; gap: 14px; padding-top: 28px; border-top: 1.5px dashed #deded6">
            <h3 style="margin: 0; font-family: 'Emilys Candy', 'Comic Sans MS', cursive; font-weight: 400; font-size: 34px; line-height: 1.15; color: #1a1a1a"><span style="font-size: 18px; color: #9a9aa2; margin-right: 10px">06</span>Reflection</h3>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">This project taught me that my most valuable contribution is not only design execution, but the ability to identify a systemic problem, build consensus around a solution and see it adopted across teams. A design system is as much an agreement between people as it is a library of components.</p>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">In hindsight, I would introduce foundational tokens in the first weeks of the product. The cost is small at the start and grows significantly later.</p>
            <blockquote style="margin: 4px 0; padding: 4px 0 4px 20px; border-left: 2px solid #2a2a2e; font-family: 'Patrick Hand', cursive; font-size: 24px; line-height: 1.4; color: #2a2a2e">“A design system is more than a collection of components. It is a shared agreement, built on trust, collaboration and a common standard of quality.”</blockquote>
          </section>

        <div class="case-q" style="display: {{quest2Display}}; flex-direction: column; gap: 40px">
          <header style="display: flex; flex-direction: column; gap: 12px">
            <span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #5d5d66">side quest 02</span>
            <h2 class="quest-title" ref="{{title2Ref}}" style="--tx: {{tx}}; --ty: {{ty}}; --ts: {{ts}}; margin: 0; font-family: 'Emilys Candy', 'Comic Sans MS', cursive; font-weight: 400; font-size: 52px; line-height: 1.1; color: #1a1a1a">Beyond the Prompt</h2>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c; font-size: 21px; line-height: 1.45; color: #2a2a2e">Helping new users communicate with generative AI.</p>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">Generative AI promised that anyone could create anything they could imagine. In practice, many new users were held back by an unfamiliar obstacle: the prompt. I led research into the gap between what users expected and what the AI produced, which resulted in two features that shipped in the product and a learning hub for new users.</p>
            <div style="display: flex; flex-wrap: wrap; gap: 12px 32px"><div style="display: flex; flex-direction: column; gap: 2px; min-width: 150px"><span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #9a9aa2">role</span><span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 16px; color: #2a2a2e">Lead Researcher and Product Designer</span></div><div style="display: flex; flex-direction: column; gap: 2px; min-width: 150px"><span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #9a9aa2">method</span><span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 16px; color: #2a2a2e">10 remote, semi-structured interviews (60 minutes each)</span></div><div style="display: flex; flex-direction: column; gap: 2px; min-width: 150px"><span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #9a9aa2">timeline</span><span style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 16px; color: #2a2a2e">Two months</span></div></div>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 14px; font-style: italic; line-height: 1.6; color: #7a7a82">To comply with my non-disclosure agreement, company and product names have been anonymised. All findings and opinions are my own and do not necessarily reflect the views of my former employer.</p>
          </header>
          <section style="display: flex; flex-direction: column; gap: 14px; padding-top: 28px; border-top: 1.5px dashed #deded6">
            <h3 style="margin: 0; font-family: 'Emilys Candy', 'Comic Sans MS', cursive; font-weight: 400; font-size: 34px; line-height: 1.15; color: #1a1a1a"><span style="font-size: 18px; color: #9a9aa2; margin-right: 10px">01</span>The problem</h3>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">Generative AI introduced a new model of human–computer interaction. While working on an AI image tool, I observed that the quality of an output depended not only on the capability of the model, but on an unwritten skill: writing an effective prompt.</p>
            <h4 style="margin: 8px 0 0; font-family: 'DM Sans', system-ui, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.4; color: #1a1a1a">Guesswork and “magic words.”</h4>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">New users relied on imitation and guesswork, copying technical-sounding terms such as “8k” or “photorealistic” from examples online without understanding their effect.</p>
            <h4 style="margin: 8px 0 0; font-family: 'DM Sans', system-ui, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.4; color: #1a1a1a">Intent versus interpretation.</h4>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">The model could recognise individual keywords, such as “duck” and “coffee cup,” but often failed to understand the relationship between them. The results were technically valid but contextually wrong.</p>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">This gap between expectation and outcome left users frustrated and undermined their sense of control and their trust in the product. The research set out to understand users' mental model of the AI and how the product could close that gap.</p>

          <section style="display: flex; flex-direction: column; gap: 14px; padding-top: 28px; border-top: 1.5px dashed #deded6">
            <h3 style="margin: 0; font-family: 'Emilys Candy', 'Comic Sans MS', cursive; font-weight: 400; font-size: 34px; line-height: 1.15; color: #1a1a1a"><span style="font-size: 18px; color: #9a9aa2; margin-right: 10px">02</span>Research approach</h3>
            <h4 style="margin: 8px 0 0; font-family: 'DM Sans', system-ui, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.4; color: #1a1a1a">Goals</h4>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">The study had three objectives:</p>
            <ol style="margin: 0; padding-left: 24px; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c"><li style="margin-bottom: 6px">To understand how users believe the AI creates an image.</li><li style="margin-bottom: 6px">To understand how users believe their words influence the output.</li><li style="margin-bottom: 6px">To identify opportunities to align users' mental model with the AI's actual behaviour, increasing trust, effectiveness and satisfaction.</li></ol>
            <h4 style="margin: 8px 0 0; font-family: 'DM Sans', system-ui, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.4; color: #1a1a1a">Participants</h4>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">I recruited 10 participants matching a “Curious Newcomer” profile: people who had used a generative image tool one to five times, were comfortable with creative software such as Canva or Figma, and described prompting as more art than science. AI specialists, developers and designers of AI products were excluded to avoid expert bias.</p>
            <h4 style="margin: 8px 0 0; font-family: 'DM Sans', system-ui, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.4; color: #1a1a1a">Method</h4>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">Each 60-minute remote session had three stages:</p>
            <ol style="margin: 0; padding-left: 24px; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c"><li style="margin-bottom: 6px"><strong style="font-weight: 500; color: #1a1a1a">Observe:</strong> participants completed a creative task while thinking aloud (for example, “Generate an image of a duck holding a coffee cup”).</li><li style="margin-bottom: 6px"><strong style="font-weight: 500; color: #1a1a1a">Probe:</strong> retrospective questions explored their reasoning, such as “What did you expect the AI to do with that word?”</li><li style="margin-bottom: 6px"><strong style="font-weight: 500; color: #1a1a1a">Explore:</strong> a broader discussion of trust, creativity and control in their relationship with AI.</li></ol>

          <section style="display: flex; flex-direction: column; gap: 14px; padding-top: 28px; border-top: 1.5px dashed #deded6">
            <h3 style="margin: 0; font-family: 'Emilys Candy', 'Comic Sans MS', cursive; font-weight: 400; font-size: 34px; line-height: 1.15; color: #1a1a1a"><span style="font-size: 18px; color: #9a9aa2; margin-right: 10px">03</span>Key findings</h3>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">The central finding was a fundamental mismatch between how users believed the AI worked and how it actually interpreted their input.</p>
            <h4 style="margin: 8px 0 0; font-family: 'DM Sans', system-ui, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.4; color: #1a1a1a">Insight 1: Users treat the AI as a collaborator to be persuaded, not a tool to be instructed.</h4>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">Participants did not hold a command-based model (“if I type X, the tool will do X”). Instead, they used abstract and emotional language, as they would when briefing a human designer, in an attempt to convey intent and mood.</p>
            <blockquote style="margin: 4px 0; padding: 4px 0 4px 20px; border-left: 2px solid #2a2a2e; font-family: 'Patrick Hand', cursive; font-size: 24px; line-height: 1.4; color: #2a2a2e">“It's like I speak English and it speaks AI. We're getting lost in translation.”</blockquote>
            <h4 style="margin: 8px 0 0; font-family: 'DM Sans', system-ui, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.4; color: #1a1a1a">Insight 2: Users believe more descriptive language produces better results, when precision is what matters.</h4>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">When a prompt failed, participants added more adjectives (“beautiful,” “majestic,” “stunning”). This typically made results less predictable, as the model struggled to interpret subjective language.</p>
            <blockquote style="margin: 4px 0; padding: 4px 0 4px 20px; border-left: 2px solid #2a2a2e; font-family: 'Patrick Hand', cursive; font-size: 24px; line-height: 1.4; color: #2a2a2e">“The more I write, the more confused it gets. The words feel like a lottery.”</blockquote>

ont-family: 'Patrick Hand', cursive; font-size: 20; text-anchor: start">precision matters more</text><path d="M467.1 160.6 Q625 159 782.6 160.3 Q794.6 160.8 794.1 172.5 Q792.7 239 794.5 306 Q794.4 317.3 782.4 318.8 Q625 316.8 467.7 318.1 Q456.6 317.5 455.4 305.5 Q456.3 239 456.5 171.8 Q455.8 159.8 469.7 159.4" style="fill: #f3e08a; stroke: none"></path><text x="625" y="198" style="fill: #2a2a2e; font-family: 'Emilys Candy', 'Comic Sans MS', cursive; font-size: 22; text-anchor: middle">“The more I write, the more</text><text x="625" y="228" style="fill: #2a2a2e; font-family: 'Emilys Candy', 'Comic Sans MS', cursive; font-size: 22; text-anchor: middle">confused it gets. The words</text><text x="625" y="258" style="fill: #2a2a2e; font-family: 'Emilys Candy', 'Comic Sans MS', cursive; font-size: 22; text-anchor: middle">feel like a lottery.”</text></g></g></svg></div>
          </section>
          <section style="display: flex; flex-direction: column; gap: 14px; padding-top: 28px; border-top: 1.5px dashed #deded6">
            <h3 style="margin: 0; font-family: 'Emilys Candy', 'Comic Sans MS', cursive; font-weight: 400; font-size: 34px; line-height: 1.15; color: #1a1a1a"><span style="font-size: 18px; color: #9a9aa2; margin-right: 10px">04</span>What I designed</h3>
            <h4 style="margin: 8px 0 0; font-family: 'DM Sans', system-ui, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.4; color: #1a1a1a">1. Prompt Co-Pilot (shipped)</h4>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">Because users approach the AI as a collaborator, I designed a feature that acts as a translator between natural language and the structured input the model requires. Users describe what they want in plain language, and the Co-Pilot rewrites it into an effective prompt. Over time, this also teaches users the principles of effective prompting.</p>

            <h4 style="margin: 8px 0 0; font-family: 'DM Sans', system-ui, sans-serif; font-size: 19px; font-weight: 500; line-height: 1.4; color: #1a1a1a">2. Contextual loading-screen tips (shipped)</h4>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">To address the belief that more descriptive language produces better results, I replaced the generic loading spinner with short, contextual prompting tips. Waiting time became an opportunity to learn.</p>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">Example tips:</p>
            <ul style="margin: 0; padding-left: 24px; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c"><li style="margin-bottom: 6px">“Instead of ‘beautiful’, try naming a specific style, such as ‘art deco’ or ‘cinematic lighting’.”</li><li style="margin-bottom: 6px">“Describe the subject first, then the setting, then the style.”</li></ul>

ans', system-ui, sans-serif; font-size: 14; font-weight: 600; fill: #4a5ce8; text-anchor: end">Read  →</text><path d="M40 694 L1160 694" style="stroke: #eceef3; stroke-width: 1; fill: none"></path><rect x="40" y="706" width="80.8" height="22" rx="11" style="fill: #e2e6fb"></rect><text x="80.4" y="721" style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 12; font-weight: 600; fill: #3443c4; text-anchor: middle">Features</text><text x="40" y="758" style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 21; font-weight: 600; fill: #161a2b; text-anchor: start">Guide your images with a sketch</text><text x="40" y="786" style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 15; font-weight: 400; fill: #5d6170; text-anchor: start">Draw a rough layout and let the model follow your composition.</text><text x="1160" y="758" style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 14; font-weight: 600; fill: #4a5ce8; text-anchor: end">Read  →</text><path d="M40 798 L1160 798" style="stroke: #eceef3; stroke-width: 1; fill: none"></path><rect x="40" y="810" width="65.6" height="22" rx="11" style="fill: #e2e6fb"></rect><text x="72.8" y="825" style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 12; font-weight: 600; fill: #3443c4; text-anchor: middle">Models</text><text x="40" y="862" style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 21; font-weight: 600; fill: #161a2b; text-anchor: start">Training your own custom models</text><text x="40" y="890" style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 15; font-weight: 400; fill: #5d6170; text-anchor: start">Teach the model a person, a product or a style with a handful of photos.</text><text x="1160" y="862" style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 14; font-weight: 600; fill: #4a5ce8; text-anchor: end">Read  →</text></svg></div></div>

          <section style="display: flex; flex-direction: column; gap: 14px; padding-top: 28px; border-top: 1.5px dashed #deded6">
            <h3 style="margin: 0; font-family: 'Emilys Candy', 'Comic Sans MS', cursive; font-weight: 400; font-size: 34px; line-height: 1.15; color: #1a1a1a"><span style="font-size: 18px; color: #9a9aa2; margin-right: 10px">05</span>Outcome</h3>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">All three recommendations reached users. The Prompt Co-Pilot and the contextual loading tips shipped in the product, and the Prompting Academy launched as a blog.</p>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">After launch, session tracking showed an increase in returning users. We also began asking users how satisfied they were with their results, and the responses were positive. Questions and confusion about writing prompts in our Discord community decreased.</p>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">Together, these features addressed the core finding of the research: users did not lack creativity, they lacked a shared language with the AI. By meeting users where they were, the product became easier to learn and more trustworthy to use.</p>
          </section>
          <section style="display: flex; flex-direction: column; gap: 14px; padding-top: 28px; border-top: 1.5px dashed #deded6">
            <h3 style="margin: 0; font-family: 'Emilys Candy', 'Comic Sans MS', cursive; font-weight: 400; font-size: 34px; line-height: 1.15; color: #1a1a1a"><span style="font-size: 18px; color: #9a9aa2; margin-right: 10px">06</span>Reflection</h3>
            <p style="margin: 0; max-width: 64ch; font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #45454c">This project reinforced that designing for AI is primarily a problem of trust and mental models, not of interface alone. In hindsight, I would take more time before drawing conclusions, and I would define success metrics before launch, such as how many people used the Co-Pilot and how often, so I could measure the impact of each feature precisely.</p>

<script>
class DCLogic extends React.Component { render(){ const v=this.renderVals(); return conv(TPL, v); } }

class Component extends DCLogic {
  // The intro itself runs on CSS (see the style block). This script handles the buttons

  //   0 intro, 1 chapter three (the side quests), 2 chapter two, 3 chapter one, (4 unused, skipped),
  //   5 the play area, 6 blender, 7 the letter garden (candle making is out for now)
