  // while it is open the page stays put.
  setup() {
    if (this.ready) return;
    this.ready = true;
    this.els = {};
    this.topRef = () => {};
    this.introRef = (el) => { this.els.intro = el; this.fitIntro(); };
    this.journeyCtaRef = (el) => { this.els.journeyCta = el; };
    this.scrapRef = (el) => { this.els.scrap = el; this.fitScrap(); };
    // the contact journal: Somya's work email, which copies itself when clicked
    this.contactEmail = 'somyagrawal.work@gmail.com';
    this.copyEmail = () => {
      const done = () => { this.setState({ copied: true }); clearTimeout(this.copiedTimer); this.copiedTimer = setTimeout(() => this.setState({ copied: false }), 1600); };
      const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = this.contactEmail; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (err) {}
        ta.remove(); done();
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(this.contactEmail).then(done, fallback);
      else fallback();
    };
    // the "Postcards from Somya" newsletter sign-up page on Substack
    this.subscribeUrl = 'https://somyawrites.substack.com/subscribe';
    this.goToJourney = (e) => { if (e && e.preventDefault) e.preventDefault(); this.go(1); };
    this.goToTop = (e) => { if (e && e.preventDefault) e.preventDefault(); this.go(0, true); };
    this.sheet3Ref = (el) => { this.els.sheet3 = el; };
    this.blocksCanvasRef = (el) => { this.els.blocksCanvas = el; };
    this.playRef = (el) => { if (el && el !== this.els.play) this.bindBlockDrag(el); this.els.play = el; };
    this.ctaRef = (el) => {
      if (el && el !== this.els.cta) { el.addEventListener('pointerenter', () => this.hopBlocks()); el.addEventListener('focus', () => this.hopBlocks()); }
      this.els.cta = el;
    };
    this.viewRef = (el) => { this.els.view = el; };
    this.heroRef = (el) => { this.els.hero = el; };
    this.card1Ref = (el) => { this.els.card1 = el; };
    this.card2Ref = (el) => { this.els.card2 = el; };
    this.openCase1 = () => this.openCase(1);
    this.openCase2 = () => this.openCase(2);
    this.openCase1Key = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.openCase(1); } };
    this.openCase2Key = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.openCase(2); } };
    this.scrollRef = (el) => {
      if (this.els.scroll && this.els.scroll !== el) this.els.scroll.removeEventListener('scroll', this.onCaseScroll);
      this.els.scroll = el;
      if (el) el.addEventListener('scroll', this.onCaseScroll, { passive: true });
    };
    // the section index on the right: which sections are on screen, and jumping to one
    this.caseSections = () => {
      const sc = this.els.scroll; if (!sc) return [];
      const q = [...sc.querySelectorAll('.case-q')].find(d => d.style.display !== 'none');
      return q ? [...q.querySelectorAll(':scope > section')] : [];
    };
    this.onCaseScroll = () => {
      const sc = this.els.scroll; if (!sc) return;
      if (this.secLock) { clearTimeout(this.secLockT); this.secLockT = setTimeout(() => { this.secLock = 0; }, 160); return; }
      const top = sc.getBoundingClientRect().top, line = sc.clientHeight * 0.35;
      let on = 0;
      this.caseSections().forEach((sec, i) => { if (sec.getBoundingClientRect().top - top < line) on = i + 1; });
      if (sc.scrollTop + sc.clientHeight >= sc.scrollHeight - 4) on = this.caseSections().length;
      if (on !== (this.state.secOn || 0)) this.setState({ secOn: on });
    };
    this.goSec = (i) => {
      const sc = this.els.scroll, sec = this.caseSections()[i - 1]; if (!sc || !sec) return;
      const y = sec.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 24;
      const smooth = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      this.secLock = i; clearTimeout(this.secLockT); this.secLockT = setTimeout(() => { this.secLock = 0; }, 700);
      this.setState({ secOn: i });
      sc.scrollTo({ top: y, behavior: smooth ? 'smooth' : 'auto' });
    };
    for (let i = 1; i <= 6; i++) this['goSec' + i] = () => this.goSec(i);
    this.title1Ref = (el) => { this.els.title1 = el; };
    this.title2Ref = () => {};
    // the play area: its own scroll, and the Blender viewer
    this.goToBlender = (e) => { if (e && e.preventDefault) e.preventDefault(); this.go(6); };
    this.modelRef = (el) => { this.els.model = el; };
    this.assetCanvasRef = (el) => { this.els.assetCanvas = el; };
    for (let i = 1; i <= 6; i++) {
      this['openAsset' + i] = () => this.openAsset(i);
      this['openAsset' + i + 'Key'] = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.openAsset(i); } };
    }
    this.closeAsset = () => this.setState({ assetOpen: 0 });
    this.resetAsset = () => { this.view3d = { x: -20, y: 30, z: 1 }; this.applyView(); };
    this.stageDown = (e) => {
      const v = this.view3d || { x: -20, y: 30, z: 1 };
      this.drag = { x: e.clientX, y: e.clientY, rx: v.x, ry: v.y };
      e.currentTarget.setPointerCapture && e.currentTarget.setPointerCapture(e.pointerId);
      e.currentTarget.classList.add('held', 'touched');
    };
    this.stageMove = (e) => {
      if (!this.drag) return;
      const v = this.view3d || { x: -20, y: 30, z: 1 };
      v.y = this.drag.ry + (e.clientX - this.drag.x) * 0.5;
      v.x = Math.max(-85, Math.min(85, this.drag.rx - (e.clientY - this.drag.y) * 0.5));
      this.view3d = v;
      this.applyView();
    };
    this.stageUp = (e) => { this.drag = null; e.currentTarget.classList.remove('held'); };
    this.closeCase = () => { this.setState({ caseOpen: 0 }); this.toTop(); };
    // the exits at the end of each side quest lead straight into the other one
    this.goQuest1 = () => { this.setState({ caseOpen: 1, switched: true }); this.toTop(); };
    this.goQuest2 = () => { this.setState({ caseOpen: 2, switched: true }); this.toTop(); };
    // the post-it index: each note jumps straight to its part of the site
    const jump = (n) => (e) => {
      if (e && e.preventDefault) e.preventDefault();
      this.setState({ caseOpen: 0, assetOpen: 0, letterOpen: 0 });
      this.go(n, true);
    };
    this.navToHome = jump(0);
    this.navToWork = jump(1);
    this.navToPlay = jump(5);
    this.navToGarden = jump(7);
    this.navToContact = jump(8);
    // the letter garden. These letters are placeholders until Somya's own writing goes in.
    const stamps = ['#f2b8c0', '#b8d0e6', '#bfd8b0', '#f3e08a', '#f2b8c0', '#b8d0e6'];
    const tilts = ['-3deg', '2deg', '-1.5deg', '2.5deg', '-2deg', '1.5deg'];
    this.letters = [
      { title: "I started writing again", date: '14 may 2026', line: "I started writing every day for ten minutes, and it changed my life.",
        paras: ["I started writing every day for ten minutes, and it changed my life.", "The idea first visited me while I was watching a video podcast with Andrew Huberman and Robert Greene. I had watched and read Robert Greene before, and his way of thinking had caught my attention, so I was naturally drawn to what he does. He mentioned the book he was working on and how he makes himself write for three hours straight every day. That was probably the first time the idea surfaced in my mind.", "What if I started writing every day? Not for three hours, of course, but maybe for ten minutes to begin with. Think about it: plenty of authors wrote their first book in their forties. If I wrote for ten minutes a day from now until then, I would have more than enough material for a book. And I love writing. It is the one thing I keep coming back to, keep reconnecting with and keep thinking about. What if I became a writer?", "At the time, I was in a restless season. Life had taken turns I hadn't planned for, and I felt like I wasn't making my own decisions. I kept questioning my choices: what I felt, and what would make me feel better. I wanted an exit from whatever this was, a chance to start over. I wanted something else, something more, something mine.", "So I started writing. I made it a habit: whenever I had a bad train of thought, whenever I felt stuck or confused, I wrote. I had always tried keeping journals. I had a big one; then I saw a video about someone with a pocket journal, bought one, and couldn't follow through. Writing by hand is therapeutic, and it's the natural way, but it has its limits. I couldn't write in a cab because of all the shaking. I couldn't write for long because my hand would get tired. My writing could never keep up with my thinking. And I didn't want to write on my phone, because something about being constantly on a phone gives me the ick. So I opened my laptop, deleted all my old pages and made a new page in Notion called \"A new life\". I am not kidding; that is literally its title.", "And I started writing.", "I wrote about whatever was on my mind. I think the first piece was about feeling stuck and not knowing what I was doing. That was where I came up with the analogy that I used to be a caterpillar and now I am a butterfly. And now that I am a butterfly, I don't know what to do, because all I know is what I did as a caterpillar. Things have changed, my form is different, I can fly, but it's scary and I don't know how. And I wrote, and wrote, and wrote.", "I gave each day a heading: whatever thought was loudest when I sat down. Some days I wrote a hundred sentences, slipped into a flow state and kept thinking out loud onto the page (a Notion page, so not real paper, but you get the point). Other days I could only manage a few sentences and couldn't go deep. But I kept going. It's been three months now, and here I am, writing to you about it. I think writing really saved me.", "In life you have to do things that expand your soul. Writing is one of those things for me.", "The most important thing writing did was create a space of my own. A little about me: I am a private person. I'm an extrovert; I can talk to people, hang out and be fun, but I live a lot in my head. I have a lot of conversations in there, and sometimes they take wrong turns. Talking to someone helps, but sometimes you don't even know what to talk about. Is it right? Is it important? What would the other person think?", "I created a space where I could be myself and see myself. I suppose I broke the fourth wall. I was what I needed to be saved. Isn't that poetic? That writing saved me? But truthfully, it was me who saved me: me who wrote things down, and me who saw myself in them. It has helped me connect with myself on a deeper, more grounded level. I found myself again.", "All I needed was someone to listen to me, and I became that person for myself. Writing didn't make me smarter or more productive. It made me stop, think and reflect. That is the golden word: reflect. There is something about seeing your thoughts written out and reading them back. What can I do to get through this? Who can I be, and what have I been doing? Writing brings up the important questions you need to ask yourself, in a way that thinking alone simply can't."] },
      { title: "You have to accept yourself as you are", date: '2 aug 2026', line: "We are an accumulation of all the people we have ever loved.",
        paras: ["We go through life meeting people, seeing them, talking to them. We are an accumulation of all the people we have ever loved, and sometimes of the people we hated. You change some things about yourself, because change is the only constant. Changing is good. Learning new things is good. It forms new neural connections. When you have an experience or learn something new, your brain forms pathways that grow stronger each time you put in the work to do it again. Learning a new language and practising it every day forms new connections, then strengthens them. It works against you, too, if you follow the same routine. It strengthens the belief that passiveness is acceptable. It makes you rigid, and your mind begins to slow.", "So what do I mean when I say you have to accept yourself as you are? Maybe I am still working it out. A lot of me changed this year. Some of it was growth, and some of it happened because I thought I had to change. For better or for worse? I guess we'll find out in due time. Somewhere along the way I stopped liking myself and the things I did, and I spent a big part of the year just following a routine.", "Sometimes I notice people who seem genuinely happy in their lives, who are actively creating them, and I wonder what that means. Oh: life is coming from you, not at you. What an amazing line. I think that is the difference. In the everyday things, in the noise of everyone around you, you can lose yourself. You take other people's words to heart and treat life as a task you have to complete.", "Some days I feel ugly. I search for beauty outside myself, in how I look and in what others might think. But do we need it, the validation?", "Can writing be a good alternative to talking? I deeply believe communication is the way to a happy life. Communication leads to connection. Humans are social animals; I feel all animals are. You need a village to survive, and I am still learning to see mine in the people around me.", "I think a lot. I'm in my head a lot, and I have a feeling it's counterproductive. You get lost in thought. But writing is different. There is something about putting your words on the page that tells you your thoughts are important. Is it important to have a goal? I write a lot; I try to write every day. Sometimes I wonder what I am leaving behind. All these writings? Who would want to read them?", "Is it important to create, or to put it out there? Maybe I'll know what I want to do after this: that is what I keep thinking.", "I am not ugly. I am feeling ugly. My brain is having ugly feelings, and that does not define me. Use \"should\" and \"must\" less. The goal is to experience new things, write a lot, laugh a lot and have fun. Always have fun.", "What does it mean to actively put negativity aside and choose fun? Being playful. Not serious. Unserious. But how does someone who lives in their head do that? When something around me feels unsteady, I can choose how much access it gets to me. Break the flow.", "I'll try that. When I have a sad or bad thought, I'll ask: what is the most important thing to me in this moment? How can I make myself feel at peace?"] },
      { title: "I wish to become\u2026", date: '9 oct 2026', line: "I want to be so many things, and I think, everything.",
        paras: ["I want to become an astronaut. I want to become a scuba diving instructor. I want to become a parasailing instructor. I want to work somewhere pet-friendly. I want to be cabin crew who look after the pets on a flight. I want to be a kindergarten teacher. I want to be so many things, and I think, everything.", "The world, the sun, the Milky Way, the universe.", "The age of whispers. Sometimes the bonds you have with people are so fragile you almost want to keep them in a satin case, surrounded by cotton and bubble wrap, like the hearts of people who wear them on their sleeves. It makes me wonder what it means when two people fall in love. Do they know it's love? How do they trust it? When they disagree, what matters more: the feelings, the argument or what comes after? What do they think about when they are alone? And when the early rush fades and things grow quieter, can people still be happy? Can feelings change once they are built? I think in any disagreement both people feel they are at the edge, and both are tired. Who is right and who is wrong? No one's feelings are more important than another's, nor can they be fully described.", "Maybe that is what love does: you start to write about yourself in the third person. You write about others who can see themselves in you. You create images of the person you want to be, and the person you want to be with. How can we step back from our feelings? How can we name the treacherous waves of anger and sadness that come along with them? Monks suggest not being affected by outer circumstances. I wonder if that holds for the builders too, people who just keep having ideas and making new things out of the new things they made. People who look at you, and you see a mirror. They show you how you look to yourself. Liking what they see is up to them.", "The worlds are up, down, left, right, and so are the words. Beginning in the middle and ending at the edge. Love is not the pill they advise, but you look at them and wish they were lying. Is it for me or for you? Who is to decide? Until you bleed trying. Face down, hands up, and the sky so blue. Making thin clouds of warmth, giving in to the urge to make it rhyme, and getting a word that comes in clues. It takes time. The idea of me and you is there. With the strong sails up, we cannot say the direction to where.", "Feeling out of place somewhere. Maybe that is how others feel too. I cannot say if it's me or the world on the shelf. A snow globe of memories buried in the thick white layer. Is it the scenery or the contents? Despair. Don't you dare come in my way. All the things that I hate are turned into flowers that grow from the sun inside of me. They are the sunshine, the sun and the light. So is the lighthouse that lures you in to loot you again.", "Vision. Envision your beginning. Beginnings are there to be done again and again. You are you, and you are elated. You are you, and you claim it."] },
    ].map((l, i) => ({
      ...l,
      paras: l.paras.map((text) => ({ text })),
      stamp: stamps[i],
      tilt: tilts[i],
      fd: `${(0.6 + i * 0.15).toFixed(2)}s`,
      pick: () => this.setState({ letterOpen: i + 1 }),
    }));
    this.closeLetter = () => this.setState({ letterOpen: 0 });
    // career pictures: click (or Enter) to open a larger preview
    this.pics = ['images/snx.webp','images/wishme.webp','images/groupia.webp','images/first-project.webp','images/first-project-wireframe.webp'];
    this.openPic = (i, e) => { this.picFrom = e && e.currentTarget; this.setState({ picOpen: i, picAltText: e && e.currentTarget ? e.currentTarget.alt : '' }); };
    this.closePic = () => { this.setState({ picOpen: 0 }); if (this.picFrom && this.picFrom.focus) this.picFrom.focus(); };
    this.pics.forEach((_, k) => {
      this['openPic' + (k + 1)] = (e) => { e.stopPropagation(); this.openPic(k + 1, e); };
      this['openPic' + (k + 1) + 'Key'] = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.openPic(k + 1, e); } };
    });
    // torn paper: a jagged edge all the way round, drawn once
    const pts = [], j = () => (Math.random() * 1.2).toFixed(2);
    for (let x = 0; x <= 100; x += 2.5) pts.push(`${x}% ${j()}%`);
    for (let y = 0; y <= 100; y += 2) pts.push(`${(100 - j()).toFixed(2)}% ${y}%`);
    for (let x = 100; x >= 0; x -= 2.5) pts.push(`${x}% ${(100 - j()).toFixed(2)}%`);
    for (let y = 100; y >= 0; y -= 2) pts.push(`${j()}% ${y}%`);
    this.tornEdge = `polygon(${pts.join(', ')})`;
    this.timers = [];
  }

  componentDidMount() {
    this.mountedAt = performance.now();
    // on phones the play and garden pages scroll inside; only turn the page once they reach their end
    const scrollRoom = (t) => {
      const el = t && t.closest ? t.closest('.phone-scroll') : null;
      if (!el || el.scrollHeight <= el.clientHeight + 2) return { down: false, up: false };
      return { down: el.scrollTop + el.clientHeight < el.scrollHeight - 2, up: el.scrollTop > 2 };
    };
    this.onWheel = (e) => {
      // inside an open side quest the wheel scrolls the story itself
      if (this.state && this.state.caseOpen) return;
      // inside an open letter the wheel scrolls the letter
      if (this.state && (this.state.letterOpen || this.state.picOpen)) return;
      const room = scrollRoom(e.target);
      if ((e.deltaY > 0 && room.down) || (e.deltaY < 0 && room.up)) return;
      // in the Blender viewer the wheel zooms
      if (this.state && this.state.assetOpen) {
        e.preventDefault();
        const v = this.view3d || { x: -20, y: 30, z: 1 };
        v.z = Math.max(0.5, Math.min(2.2, v.z * (e.deltaY > 0 ? 0.92 : 1.08)));
        this.view3d = v;
        this.applyView();
        return;
      }
      e.preventDefault();
      if (Math.abs(e.deltaY) < 6) return;
      this.go(this.step() + (e.deltaY > 0 ? 1 : -1));
    };
    this.onKey = (e) => {
      if (this.state && this.state.caseOpen) return;
      if (this.state && this.state.picOpen) {
        if (e.key === 'Escape') this.closePic();
        return;
      }
      if (this.state && this.state.letterOpen) {
        if (e.key === 'Escape') this.closeLetter();
        return;
      }
      if (this.state && this.state.assetOpen) {
        if (e.key === 'Escape') this.closeAsset();
        const v = this.view3d || { x: -20, y: 30, z: 1 };
        if (e.key === 'ArrowLeft') v.y -= 15;
        if (e.key === 'ArrowRight') v.y += 15;
        if (e.key === 'ArrowUp') v.x = Math.min(85, v.x + 15);
        if (e.key === 'ArrowDown') v.x = Math.max(-85, v.x - 15);
        if (e.key.startsWith('Arrow')) { e.preventDefault(); this.view3d = v; this.applyView(); }
        return;
      }
      if (['ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); this.go(this.step() + 1); }
      if (['ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); this.go(this.step() - 1); }
    };
    this.onTouchStart = (e) => { this.touchY = e.touches[0].clientY; this.touchRoom = scrollRoom(e.target); };
    this.onTouchEnd = (e) => {
      const dy = this.touchY - e.changedTouches[0].clientY;
      if (this.state && (this.state.assetOpen || this.state.letterOpen || this.state.picOpen)) return;
      if (this.blockGrab) return;
      if (this.state && this.state.caseOpen) return;
      const room = this.touchRoom || {};
      if ((dy > 0 && room.down) || (dy < 0 && room.up)) return;
      if (Math.abs(dy) > 40) this.go(this.step() + (dy > 0 ? 1 : -1));
    };
    window.addEventListener('wheel', this.onWheel, { passive: false });
    window.addEventListener('keydown', this.onKey);
    window.addEventListener('touchstart', this.onTouchStart, { passive: true });
    window.addEventListener('touchend', this.onTouchEnd, { passive: true });
    this.onFit = () => { this.fitIntro(); this.fitScrap(); };
    window.addEventListener('resize', this.onFit);
    // three.js and the blocks load later, when the visitor gets near the play area (see renderVals)
    // The screen never scrolls: if focus lands somewhere the browser would scroll to, put it back.
    const root = document.querySelector('.track') && document.querySelector('.track').parentElement;
    if (root) { this.onRootScroll = () => { if (root.scrollTop || root.scrollLeft) { root.scrollTop = 0; root.scrollLeft = 0; } }; root.addEventListener('scroll', this.onRootScroll); this.els.root = root; }
    this.syncFocus();
  }

  componentWillUnmount() {
    if (this.els.root && this.onRootScroll) this.els.root.removeEventListener('scroll', this.onRootScroll);
    window.removeEventListener('wheel', this.onWheel);
    window.removeEventListener('keydown', this.onKey);
    window.removeEventListener('touchstart', this.onTouchStart);
    window.removeEventListener('touchend', this.onTouchEnd);
    window.removeEventListener('resize', this.onFit);
    this.timers.forEach(clearTimeout);
    const t3 = this.thomas3d;
    if (t3 && t3.raf) cancelAnimationFrame(t3.raf);
    if (t3 && t3.renderer) t3.renderer.dispose();
    const b = this.blocks;
    if (b && b.raf) cancelAnimationFrame(b.raf);
    if (b && b.onResize) window.removeEventListener('resize', b.onResize);
    if (b && b.renderer) b.renderer.dispose();
  }

  step() { return (this.state && this.state.step) || 0; }

  componentDidUpdate() { this.syncFocus(); }

  // Only what is on screen can take keyboard focus: the pages off screen, the pages of the career
  // book underneath the one on top, and closed overlays are made inert, so Tab never reaches into
  // a hidden page (which would scroll it into view and leave the screen half blank).
  syncFocus() {
    const s = this.state || {}, step = s.step || 0;
    const q = (sel) => document.querySelector(sel);
    const set = (el, off) => { if (el && el.inert !== off) el.inert = off; };
    const overlay = !!(s.caseOpen || s.assetOpen || s.picOpen || s.letterOpen);
    set(q('#top'), step !== 0);
    const book = q('#journey');
    set(book, !(step >= 1 && step <= 3) || overlay);
    // the pages run chapter one, two, three in the markup; three is on top at step 1
    if (book) book.querySelectorAll('.book-pile > .page-turn').forEach((pg, i) => set(pg, i !== 3 - step));
    set(q('#play'), step !== 5 || overlay);
    set(q('#play-blender'), step !== 6 || overlay);
    set(q('#garden'), step !== 7 || overlay);
    set(q('#contact'), step !== 8 || overlay);
    set(q('.case-view'), !s.caseOpen);
    set(q('.asset-view'), !s.assetOpen);
    set(q('.pic-view'), !s.picOpen);
    set(q('.letter-view'), !s.letterOpen);
  }

  // The play area's blocks: Somya's Blender blocks (models/blocks.glb), drawn with three.js
  // and moved by a small 2D physics world (matter.js). They drop onto the heading the first
  // time the page opens, then can be picked up, thrown and dropped anywhere on the page.
  loadBlockLibs() {
    if (this.blockLibs) return this.blockLibs;
    const script = (src) => new Promise((ok, fail) => {
      if (window.Matter) return ok();
      const el = document.createElement('script');
      el.src = src; el.onload = ok; el.onerror = fail;
      document.head.appendChild(el);
    });
    const load = new Function('u', 'return import(u)');
    this.blockLibs = Promise.all([
      load('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'),
      script('https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js'),
      // the canvas only serves web file types, so the .glb travels as base64 inside a .json
      fetch('models/blocks.glb.json').then((r) => { if (!r.ok) throw new Error('blocks.glb ' + r.status); return r.json(); })
        .then((f) => Uint8Array.from(atob(f.data), (c) => c.charCodeAt(0)).buffer),
    ]).then(([THREE, , glb]) => ({ THREE, M: window.Matter, glb }));
    this.blockLibs.catch(() => {});
    return this.blockLibs;
  }

  // A tiny .glb reader: every node with a mesh becomes one piece, with its own material.
  parseBlocks(THREE, buf) {
    const dv = new DataView(buf);
    const jsonLen = dv.getUint32(12, true);
    const gltf = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 20, jsonLen)));
    const bin = 20 + jsonLen + 8;
    const read = (i) => {
      const a = gltf.accessors[i], v = gltf.bufferViews[a.bufferView];
      const n = { SCALAR: 1, VEC2: 2, VEC3: 3, VEC4: 4 }[a.type];
      const T = { 5126: Float32Array, 5125: Uint32Array, 5123: Uint16Array, 5121: Uint8Array, 5120: Int8Array }[a.componentType];
      const at = bin + (v.byteOffset || 0) + (a.byteOffset || 0);
      const raw = new T(buf.slice(at, at + a.count * n * T.BYTES_PER_ELEMENT));
      // compact positions: 16-bit steps across the mesh's box, mapped back to floats here
      const q = a.extras && a.extras.q;
      if (q) {
        const f = new Float32Array(raw.length);
        for (let i = 0; i < raw.length; i++) { const c = i % n; f[i] = q[0][c] + (q[1][c] - q[0][c]) * raw[i] / 65535; }
        return new THREE.BufferAttribute(f, n);
      }
      return new THREE.BufferAttribute(raw, n, !!a.normalized);
    };
    const num = (x, d) => (typeof x === 'number' ? x : d);
    const mats = (gltf.materials || []).map((m) => {
      const p = m.pbrMetallicRoughness || {};
      const ext = m.extensions || {};
      const cc = ext.KHR_materials_clearcoat || {};
      const sp = ext.KHR_materials_specular || {};
      const c = p.baseColorFactor || [1, 1, 1, 1];
      const mat = new THREE.MeshPhysicalMaterial({
        roughness: num(p.roughnessFactor, 1), metalness: num(p.metallicFactor, 1),
        clearcoat: num(cc.clearcoatFactor, 0), clearcoatRoughness: num(cc.clearcoatRoughnessFactor, 0),
        specularIntensity: num(sp.specularFactor, 1),
      });
      mat.color.setRGB(c[0], c[1], c[2]);
      return mat;
    });
    const pieces = [];
    gltf.nodes.forEach((node) => {
      if (node.mesh === undefined) return;
      const mesh = gltf.meshes[node.mesh];
      const prim = mesh.primitives[0];
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', read(prim.attributes.POSITION));
      if (prim.attributes.NORMAL !== undefined) geo.setAttribute('normal', read(prim.attributes.NORMAL));
      else geo.computeVertexNormals();
      if (prim.indices !== undefined) geo.setIndex(read(prim.indices));
      geo.computeBoundingBox();
      const bb = geo.boundingBox, size = new THREE.Vector3(), mid = new THREE.Vector3();
      bb.getSize(size); bb.getCenter(mid);
      geo.translate(-mid.x, -mid.y, -mid.z);
      const round = /sphere/i.test((node.name || '') + ' ' + (mesh.name || ''));
      if (round) {
        // a ball's normals point straight out from its centre, so it shades smooth
        const pos = geo.attributes.position, nor = new Float32Array(pos.count * 3), v = new THREE.Vector3();
        for (let i = 0; i < pos.count; i++) { v.fromBufferAttribute(pos, i).normalize(); nor.set([v.x, v.y, v.z], i * 3); }
        geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
      }
      const k = (node.scale || [1, 1, 1])[0];
      const t = node.translation || [0, 0, 0];
      pieces.push({
        geo, mat: mats[prim.material] || new THREE.MeshPhysicalMaterial({ color: 0xcccccc }),
        k, w: size.x * k, h: size.y * k, d: size.z * k, round,
        fx: t[0] + mid.x * k, fy: t[1] + mid.y * k,
      });
    });
    return pieces;
  }

  startBlocks() {
    if (this.blocks) return;
    this.blocks = { loading: true };
    this.loadBlockLibs()
      .then(({ THREE, M, glb }) => this.buildBlocks(THREE, M, glb))
      .catch((err) => { console.warn('the play blocks could not load', err); this.blocks = { failed: true }; });
  }

  buildBlocks(THREE, M, glb) {
    const section = this.els.play, canvas = this.els.blocksCanvas;
    if (!section || !canvas) { this.blocks = null; this.blocksQueued = false; return; }
    const pieces = this.parseBlocks(THREE, glb);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    const scene = new THREE.Scene();
    // soft studio light, so the satin plastic reads: a grey room with three bright panels
    const room = new THREE.Scene();
    room.add(new THREE.Mesh(new THREE.BoxGeometry(10, 10, 10), new THREE.MeshBasicMaterial({ color: 0x3a3a3a, side: THREE.BackSide })));
    const panel = (x, y, z, w, h, k) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(k, k, k), side: THREE.DoubleSide }));
      m.position.set(x, y, z); m.lookAt(0, 0, 0); room.add(m);
    };
    panel(0, 4.6, 1.5, 6, 3, 2.2); panel(-4.6, 1, 3, 2.5, 4, 1.4); panel(4.6, 1.5, 1, 2, 3, 0.8);
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(room, 0.04).texture;
    pmrem.dispose();
    const sun = new THREE.DirectionalLight(0xffffff, 1.9);
    sun.position.set(-0.5, 1, 0.9);
    scene.add(sun);
    // a soft light from the front and a little fill all round, so the colours stay bright
    const front = new THREE.DirectionalLight(0xffffff, 1.1);
    front.position.set(0.3, 0.2, 1);
    scene.add(front);
    scene.add(new THREE.HemisphereLight(0xffffff, 0xf2efe6, 0.9));
    // looking down only slightly, so the tops of the blocks just show
    const tilt = 0.12, lift = 1 / Math.cos(tilt);
    const camera = new THREE.OrthographicCamera(0, 1, 0, -1, -3000, 3000);
    camera.rotation.x = -tilt;

    const engine = M.Engine.create();
    engine.gravity.y = 1.1;
    engine.positionIterations = 10;
    engine.velocityIterations = 8;
    const b = { THREE, M, renderer, scene, camera, engine, live: [], statics: [], drag: null, acc: 0 };
    this.blocks = b;

    const W = () => section.clientWidth, H = () => section.clientHeight;
    // two of every piece in the .glb, shown straight on
    const unit = Math.max(42, Math.min(120, W() * 0.075));
    const yaw = 0;
    b.pieces = pieces.concat(pieces).map((p, i) => {
      const mesh = new THREE.Mesh(p.geo, p.mat);
      mesh.scale.setScalar(p.k * unit);
      mesh.userData.k = p.k * unit;
      mesh.rotation.order = 'ZYX';
      mesh.rotation.y = p.round ? 0 : yaw;
      mesh.visible = false;
      scene.add(mesh);
      const opts = { friction: 0.7, frictionStatic: 0.9, frictionAir: 0.012, restitution: p.round ? 0.35 : 0.12, density: 0.002 };
      const body = p.round
        ? M.Bodies.circle(0, 0, (p.w * unit) / 2, opts)
        : M.Bodies.rectangle(0, 0, (p.w * Math.cos(yaw) + p.d * Math.sin(yaw)) * unit, p.h * unit, Object.assign({ chamfer: { radius: 3 } }, opts));
      return { mesh, body, h: p.h * unit, w: p.w * unit };
    });

    // the floor, the two side walls, and the words on the page are all solid
    const rel = (el, text) => {
      const page = section.getBoundingClientRect();
      let r = el.getBoundingClientRect();
      if (text) { const range = document.createRange(); range.selectNodeContents(el); r = range.getBoundingClientRect(); }
      // the words may still be fading up 12px into place; measure where they will settle
      const t = getComputedStyle(el).transform;
      const dy = t && t !== 'none' ? new DOMMatrix(t).m42 : 0;
      return { x: r.left - page.left, y: r.top - page.top - dy, w: r.width, h: r.height };
    };
    b.layout = () => {
      const w = W(), h = H();
      renderer.setSize(w, h, false);
      camera.right = w; camera.bottom = -h;
      camera.updateProjectionMatrix();
      if (b.statics.length) M.Composite.remove(engine.world, b.statics);
      const wall = { isStatic: true, friction: 0.8 };
      b.statics = [
        M.Bodies.rectangle(w / 2, h + 36, w * 3, 80, wall),
        M.Bodies.rectangle(-40, 0, 80, h * 4, wall),
        M.Bodies.rectangle(w + 40, 0, 80, h * 4, wall),
      ];
      const words = section.querySelectorAll('.play-fade');
      words.forEach((el) => {
        if (el.offsetParent === null) return;
        const r = rel(el, el.tagName !== 'A');
        if (r.w && r.h) b.statics.push(M.Bodies.rectangle(r.x + r.w / 2, r.y + r.h / 2, r.w, r.h, { ...wall, collisionFilter: { category: 0x0002 } }));
        b.wordsBottom = Math.max(b.wordsBottom || 0, r.y + r.h);
      });
      M.Composite.add(engine.world, b.statics);
      const h2 = section.querySelector('h2');
      const s = h2 ? rel(h2, true) : { x: w * 0.2, y: h * 0.4, w: w * 0.6, h: 0 };
      const x0 = Math.max(20, s.x), x1 = Math.min(w - 20, s.x + s.w);
      b.shelf = { x: x0, y: s.y, w: Math.max(0, x1 - x0), h: s.h };
    };
    b.layout();
    b.onResize = () => { b.layout(); b.keepIn(); };
    window.addEventListener('resize', b.onResize);

    // a block being carried passes through the words, so one resting on the heading can be
    // pulled straight off it; once let go it stays a ghost until it is clear of every word
    b.ghost = (body) => { body.collisionFilter.mask = 0xFFFFFFFF ^ 0x0002; body.ghosted = true; };
    b.unghost = () => {
      const words = b.statics.filter((s) => s.collisionFilter.category === 0x0002);
      b.live.forEach((p) => {
        const body = p.body;
        if (!body.ghosted || (b.drag && b.drag.bodyB === body)) return;
        if (!words.some((w) => M.Bounds.overlaps(w.bounds, body.bounds))) { body.collisionFilter.mask = 0xFFFFFFFF; body.ghosted = false; }
      });
    };

    // a block that ends up outside the page comes back in from the top
    b.keepIn = () => {
      const w = W(), h = H();
      b.live.forEach((p) => {
        const q = p.body.position;
        if (q.y > h + 200 || q.x < -150 || q.x > w + 150 || q.y < -2000) {
          M.Body.setPosition(p.body, { x: w / 2 + (Math.random() - 0.5) * w * 0.4, y: -p.h - 40 });
          M.Body.setVelocity(p.body, { x: 0, y: 0 });
        }
      });
    };

    // the drop, as in the pencil wireframe: blocks pop in a little above a tower in each
    // corner and fall onto it one after another, left and right in turn, with a few landing
    // on the floor in between. The widest blocks go at the bottom and a ball on each top.
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const balls = b.pieces.filter((p) => p.body.circleRadius);
    const boxes = b.pieces.filter((p) => !p.body.circleRadius).sort((p, q) => q.w - p.w);
    const towers = [{ x: 0, list: [] }, { x: 0, list: [] }, { x: 0, list: [], floor: true }];
    boxes.forEach((p, i) => (i >= boxes.length - 2 ? towers[2] : towers[i % 2]).list.push(p));
    balls.forEach((p, i) => (i < 2 ? towers[i] : towers[2]).list.push(p));
    const edge = Math.max(16, W() * 0.015);
    const widest = boxes.length ? boxes[0].w : unit;
    towers[0].x = edge + widest / 2;
    towers[1].x = W() - edge - widest / 2;
    // on a narrow screen the floor between the towers is small, so those blocks go mid-way
    const floorSpots = W() >= 700 ? [0.16, 0.84, 0.25, 0.75] : [0.36, 0.64, 0.45, 0.55];
    const order = [];
    for (let k = 0; order.length < b.pieces.length; k++) {
      [0, 1].forEach((t) => { if (towers[t].list[k]) order.push([towers[t], towers[t].list[k]]); });
      if (k % 2 === 1 && towers[2].list[(k - 1) / 2]) order.push([towers[2], towers[2].list[(k - 1) / 2]]);
      if (k > 40) break;
    }
    towers[2].list.forEach((p) => { if (!order.some((o) => o[1] === p)) order.push([towers[2], p]); });
    const gap = reduce ? 0 : 380;
    let floorN = 0;
    order.forEach(([tower, p], i) => {
      const fx = tower.floor ? W() * floorSpots[floorN++ % floorSpots.length] : tower.x;
      setTimeout(() => {
        // the top of whatever is already standing there
        const near = tower.floor ? [] : tower.list.filter((q) => b.live.includes(q));
        const top = near.length ? Math.min(...near.map((q) => q.body.bounds.min.y)) : H();
        M.Body.setPosition(p.body, { x: fx + (Math.random() - 0.5) * 6, y: top - p.h / 2 - (reduce ? 2 : Math.min(110, unit * 1.2)) });
        M.Body.setAngle(p.body, (Math.random() - 0.5) * 0.06);
        M.Composite.add(engine.world, p.body);
        p.mesh.visible = true;
        b.live.push(p);
      }, gap * i);
    });
    setTimeout(() => this.setState({ blocksReady: true }), gap * b.pieces.length + 1000);

    const frame = 1000 / 60;
    const tick = (t) => {
      b.raf = requestAnimationFrame(tick);
      const dt = Math.min(100, t - (b.last || t));
      b.last = t;
      if (this.step() !== 5 && !b.drag) return;
      b.acc += dt;
      let n = 0;
      while (b.acc >= frame && n < 4) { M.Engine.update(engine, frame); b.acc -= frame; n++; }
      if (n === 4) b.acc = 0;
      b.keepIn();
      b.unghost();
      b.live.forEach((p) => {
        p.mesh.position.set(p.body.position.x, -p.body.position.y * lift, 0);
        p.mesh.rotation.z = -p.body.angle;
      });
      renderer.render(scene, camera);
    };
    b.raf = requestAnimationFrame(tick);
  }

  // picking a block up: press on it, drag, let go to drop (or throw) it
  bindBlockDrag(section) {
    const at = (e) => { const r = section.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    const hit = (pt) => {
      const b = this.blocks;
      if (!b || !b.live || !b.live.length) return null;
      const found = b.M.Query.point(b.live.map((p) => p.body), pt);
      return found[found.length - 1] || null;
    };
    section.addEventListener('pointerdown', (e) => {
      if (this.step() !== 5 || e.button > 0) return;
      const pt = at(e), body = hit(pt);
      if (!body) return;
      e.preventDefault();
      const b = this.blocks, M = b.M;
      b.drag = M.Constraint.create({
        pointA: pt, bodyB: body,
        pointB: { x: pt.x - body.position.x, y: pt.y - body.position.y },
        angleB: body.angle, length: 0.01, stiffness: 0.2, damping: 0.1,
      });
      M.Composite.add(b.engine.world, b.drag);
      b.ghost(body);
      this.blockGrab = true;
      this.dragged = false;
      try { section.setPointerCapture(e.pointerId); } catch (err) {}
      section.style.cursor = 'grabbing';
      if (!(this.state && this.state.blocksTouched)) this.setState({ blocksTouched: true });
    });
    section.addEventListener('pointermove', (e) => {
      const b = this.blocks;
      if (b && b.drag) { const pt = at(e); b.drag.pointA.x = pt.x; b.drag.pointA.y = pt.y; this.dragged = true; return; }
      if (e.pointerType === 'mouse') section.style.cursor = hit(at(e)) ? 'grab' : '';
    });
    const drop = () => {
      const b = this.blocks;
      if (!b || !b.drag) return;
      b.M.Composite.remove(b.engine.world, b.drag);
      b.drag = null;
      section.style.cursor = '';
      this.dropAt = Date.now();
      setTimeout(() => { this.blockGrab = false; }, 60);
    };
    section.addEventListener('pointerup', drop);
    section.addEventListener('pointercancel', drop);
    // letting go of a block over the button should not press it
    section.addEventListener('click', (e) => {
      if (this.dropAt && Date.now() - this.dropAt < 250) { e.preventDefault(); e.stopPropagation(); }
    }, true);
  }

  // hovering "let's play?" makes every block hop
  hopBlocks() {
    const b = this.blocks;
    if (!b || !b.live || !b.live.length) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const now = Date.now();
    if (now - (b.hopAt || 0) < 700) return;
    b.hopAt = now;
    b.live.forEach((p) => {
      if (b.drag && b.drag.bodyB === p.body) return;
      b.M.Body.setVelocity(p.body, { x: (Math.random() - 0.5) * 3, y: -(5 + Math.random() * 4) });
      b.M.Body.setAngularVelocity(p.body, (Math.random() - 0.5) * 0.2);
    });
  }


  // Move to a step. While a slide or page turn is playing, extra scrolls are ignored,
  // so one flick of the wheel turns exactly one page.
  go(next, force) {
    let to = Math.max(0, Math.min(8, next));
    // step 4 (the old "to be continued" page) is gone: chapter three leads straight to play
    if (to === 4) to = this.step() < 4 ? 5 : 3;
    if (to === this.step() || (this.busy && !force)) return;
    if (this.state && this.state.caseOpen && !force) return;
    this.busy = true;
    clearTimeout(this.busyTimer);
    this.busyTimer = setTimeout(() => { this.busy = false; }, 1300);
    this.setState({ step: to });
  }

  // Open a side quest: the page fades away piece by piece, then the image in the chosen card
  // scales up to fill the window and settles into the header at the top, while the card's
  // title travels to become the page header. The motion is CSS; this only measures the start.
  openCase(n) {
    if (this.state && this.state.caseOpen) return;
    const { view, scroll, title1 } = this.els;
    const card = this.els['card' + n];
    this.toTop();
    if (scroll) setTimeout(() => scroll.focus({ preventScroll: true }), 60);
    const fly = {};
    if (view && card) {
      // Measure where the card's image and title are now; the CSS flight starts there.
      const page = view.getBoundingClientRect();
      const box = (card.children[1] || card).getBoundingClientRect();
      fly.hx = `${box.left - page.left}px`;
      fly.hy = `${box.top - page.top}px`;
      fly.hw = `${box.width}px`;
      fly.hh = `${box.height}px`;
      fly.vh = `${page.height}px`;
      // Both side quests put their title in the same spot, so side quest one's stands in for either.
      const caption = card.querySelector('figcaption');
      const from = caption && caption.children[1];
      if (from && title1) {
        const textBox = (el) => { const range = document.createRange(); range.selectNodeContents(el); return range.getBoundingClientRect(); };
        const a = textBox(from);
        const h = title1.getBoundingClientRect();
        const b = textBox(title1);
        const scale = a.height / b.height;
        fly.ts = String(scale);
        fly.tx = `${a.left - h.left - scale * (b.left - h.left)}px`;
        fly.ty = `${a.top - h.top - scale * (b.top - h.top)}px`;
      }
    }
    this.setState({ caseOpen: n, fly, switched: false });
  }

  openAsset(n) {
    this.view3d = { x: -20, y: 30, z: 1 };
    this.applyView();
    this.setState({ assetOpen: n });
    if (n === 1) this.useThomas().then((t) => { if (t) t.viewer.spun = false; });
    if (n === 2) this.useRoom();
  }

  // Thomas, Somya's guinea pig, from models/thomas.json: the Blender model with its Draco
  // compression undone and its parts (body, eyes, ears, nose, feet) kept apart so they can be
  // moved in code. One small three.js renderer draws him (and the other pieces) into the viewer.
  useThomas() {
    if (this.thomasLoad) return this.thomasLoad;
    const load = new Function('u', 'return import(u)');
    this.thomasLoad = Promise.all([
      load('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'),
      fetch('models/thomas.json').then((r) => { if (!r.ok) throw new Error('thomas ' + r.status); return r.json(); }),
    ]).then(([THREE, data]) => this.buildThomas(THREE, data))
      .catch((err) => { console.warn('Thomas could not load', err); return null; });
    return this.thomasLoad;
  }

  // the tiny living room, Somya's second Blender piece, from models/room.json (same packing as
  // Thomas, flat colours, no texture). It joins Thomas's viewer and shows when tile two is open.
  useRoom() {
    if (this.roomLoad) return this.roomLoad;
    this.roomLoad = Promise.all([
      this.useThomas(),
      fetch('models/room.json').then((r) => { if (!r.ok) throw new Error('room ' + r.status); return r.json(); }),
    ]).then(([t, data]) => {
      if (!t) return null;
      const room = this.makeThomas(t.THREE, data, null);
      room.position.y = -room.userData.height / 2;
      room.visible = false;
      t.spin.add(room);
      t.models[2] = room;
      return room;
    }).catch((err) => { console.warn('the room could not load', err); this.roomLoad = null; return null; });
    return this.roomLoad;
  }

  makeThomas(THREE, data, tex) {
    const bytes = (b) => Uint8Array.from(atob(b), (c) => c.charCodeAt(0)).buffer;
    const mats = data.mats.map((m) => {
      const mat = new THREE.MeshStandardMaterial({ roughness: m.rough, metalness: 0 });
      mat.color.setRGB(m.color[0], m.color[1], m.color[2]);
      if (m.tex && tex) mat.map = tex;
      return mat;
    });
    const group = new THREE.Group(), parts = {};
    data.parts.forEach((p) => {
      const q = new Uint16Array(bytes(p.pos)), n = new Int8Array(bytes(p.nor)), u = new Uint16Array(bytes(p.uv));
      const pos = new Float32Array(q.length), nor = new Float32Array(n.length), uv = new Float32Array(u.length);
      for (let i = 0; i < q.length; i++) { const k = i % 3; pos[i] = p.lo[k] + (q[i] / 65535) * (p.hi[k] - p.lo[k]); nor[i] = n[i] / 127; }
      for (let i = 0; i < u.length; i++) { const k = i % 2; uv[i] = p.ulo[k] + (u[i] / 65535) * (p.uhi[k] - p.ulo[k]); }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
      if (uv.length) geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
      geo.setIndex(new THREE.BufferAttribute(p.idx32 ? new Uint32Array(bytes(p.idx)) : new Uint16Array(bytes(p.idx)), 1));
      const mesh = new THREE.Mesh(geo, mats[p.mat]);
      mesh.position.fromArray(p.t); mesh.quaternion.fromArray(p.r); mesh.scale.fromArray(p.s);
      mesh.userData.home = { p: mesh.position.clone(), s: mesh.scale.clone() };
      parts[p.name] = mesh;
      group.add(mesh);
    });
    // stand him on y = 0, centred, about one unit long
    const box = new THREE.Box3().setFromObject(group), size = new THREE.Vector3(), mid = new THREE.Vector3();
    box.getSize(size); box.getCenter(mid);
    const k = 1 / Math.max(size.x, size.y, size.z);
    const pivot = new THREE.Group();
    group.position.set(-mid.x, -box.min.y, -mid.z);
    pivot.add(group);
    pivot.scale.setScalar(k);
    const holder = new THREE.Group();
    holder.add(pivot);
    holder.userData = { parts, pivot, height: size.y * k };
    return holder;
  }

  buildThomas(THREE, data) {
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    const tex = new THREE.TextureLoader().load(data.tex, () => { t.dirty = true; if (t.viewer) t.viewer.dirty = true; });
    tex.flipY = false;
    tex.colorSpace = THREE.SRGBColorSpace;
    const lights = () => {
      const scene = new THREE.Scene();
      scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d2c4, 1.9));
      const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(2, 4, 3); scene.add(key);
      const fill = new THREE.DirectionalLight(0xffffff, 0.7); fill.position.set(-3, 1, 2); scene.add(fill);
      return scene;
    };
    const viewScene = lights(), model = this.makeThomas(THREE, data, tex);
    model.position.y = -model.userData.height / 2;
    const spin = new THREE.Group(); spin.add(model); viewScene.add(spin);
    const viewCam = new THREE.PerspectiveCamera(32, 1, 0.1, 30);
    const t = this.thomas3d = { THREE, renderer, viewScene, spin, viewCam, models: { 1: model }, viewer: { dirty: true, spun: false }, dirty: true };
    const draw2d = (canvas, w, h) => {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      if (canvas.width !== Math.round(w * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(renderer.domElement, 0, 0, canvas.width, canvas.height);
    };
    const size = (w, h) => {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      if (t.w !== w || t.h !== h || t.dpr !== dpr) { renderer.setPixelRatio(dpr); renderer.setSize(w, h, false); t.w = w; t.h = h; t.dpr = dpr; }
    };
    const frame = (now) => {
      t.raf = requestAnimationFrame(frame);
      if (document.hidden) return;
      const s = this.state || {};
      const time = now / 1000;
      // the Blender viewer
      const vc = this.els.assetCanvas;
      const shown = t.models[s.assetOpen];
      if (shown && vc && vc.clientWidth) {
        Object.values(t.models).forEach((m) => { m.visible = m === shown; });
        const v = this.view3d || { x: -20, y: 30, z: 1 };
        const touched = vc.parentNode && vc.parentNode.classList.contains('touched');
        const idle = touched || this.reducedMotion() ? 0 : time * 0.35;
        spin.rotation.set(-v.x * Math.PI / 180, v.y * Math.PI / 180 + idle, 0, 'YXZ');
        const w = vc.clientWidth, h = vc.clientHeight;
        viewCam.aspect = w / h; viewCam.updateProjectionMatrix();
        viewCam.position.set(0, 0, 2.7 / v.z); viewCam.lookAt(0, 0, 0);
        size(w, h);
        renderer.render(viewScene, viewCam);
        draw2d(vc, w, h);
      }
    };
    t.raf = requestAnimationFrame(frame);
    return t;
  }

  reducedMotion() { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }

  // The intro is drawn on a 1280 by 832 board; on smaller windows it shrinks to fit (on phones
  // it fits the name and tagline to the width, letting the doodles at the edges fall off).
  fitIntro() {
    const el = this.els.intro;
    if (!el) return;
    const w = window.innerWidth, h = window.innerHeight;
    const k = Math.min(1, h / 832, w < 700 ? (w - 28) / 620 : w / 1280);
    el.style.scale = k < 0.999 ? String(k) : '';
  }

  // scale the contact journal (laid out at 1280 x 832, or 462 x 1452 with its pages stacked on phones) to the screen
  fitScrap() {
    const el = this.els.scrap;
    if (!el) return;
    const w = window.innerWidth, h = window.innerHeight;
    const phone = w <= 600;
    const k = phone ? Math.min(1, (w - 24) / 462) : Math.min(1, (w - 40) / 1280, (h - 76) / 832);
    el.style.setProperty('--k', String(k));
    el.style.width = `${(phone ? 462 : 1280) * k}px`;
    el.style.height = `${(phone ? 1452 : 832) * k}px`;
  }

  applyView() {
    const t = this.thomas3d;
    if (t && t.viewer) t.viewer.dirty = true;
    const m = this.els.model;
    const v = this.view3d;
    if (m && v) m.style.transform = `scale(${v.z}) rotateX(${v.x}deg) rotateY(${v.y}deg)`;
  }

  toTop() {
    if (this.els.scroll) this.els.scroll.scrollTop = 0;
    if (this.state && this.state.secOn) this.setState({ secOn: 0 });
  }

  // "write it again": restart every CSS animation in the intro from the beginning.
  renderVals() {
    this.setup();
    const s = this.state || {};
    const step = s.step || 0;
    // once a page has been opened, its words have faded in and stay
    this.seen = Math.max(this.seen || 0, step);
    const seen = this.seen;
    if (step >= 2 && !this.libsQueued) { this.libsQueued = true; setTimeout(() => this.loadBlockLibs(), 0); }
    if (step === 5 && !this.blocksQueued) { this.blocksQueued = true; setTimeout(() => this.startBlocks(), 700); }
    const fly = s.fly || {};
    return {
      topRef: this.topRef,
      introRef: this.introRef,
      journeyCtaRef: this.journeyCtaRef,
      // the book is one screen whatever page it is on; the play pages follow it
      trackY: step >= 5 ? `-${(step - 3) * 100}vh` : step >= 1 ? '-100vh' : '0',
      modelRef: this.modelRef,
      openAsset1: this.openAsset1, openAsset2: this.openAsset2, openAsset3: this.openAsset3,
      openAsset4: this.openAsset4, openAsset5: this.openAsset5, openAsset6: this.openAsset6,
      openAsset1Key: this.openAsset1Key, openAsset2Key: this.openAsset2Key, openAsset3Key: this.openAsset3Key,
      openAsset4Key: this.openAsset4Key, openAsset5Key: this.openAsset5Key, openAsset6Key: this.openAsset6Key,
      closeAsset: this.closeAsset,
      resetAsset: this.resetAsset,
      stageDown: this.stageDown,
      stageMove: this.stageMove,
      stageUp: this.stageUp,
      assetViewClass: s.assetOpen ? 'open' : '',
      assetCanvasRef: this.assetCanvasRef,
      assetCanvasDisplay: s.assetOpen === 1 || s.assetOpen === 2 ? 'block' : 'none',
      assetCubeDisplay: s.assetOpen === 1 || s.assetOpen === 2 ? 'none' : 'block',
      assetName: s.assetOpen === 1 ? 'thomas' : s.assetOpen === 2 ? 'a tiny living room' : '[asset name]',
